<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Chụp ảnh thẻ 3x4</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #111; color: #fff;
    font-family: -apple-system, Roboto, "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }
  .screen {
    position: fixed; inset: 0;
    display: none;
    flex-direction: column;
    padding: 20px;
  }
  .screen.active { display: flex; }
  .screen-title { font-size: 19px; font-weight: 600; margin: 8px 0 16px; text-align: center; }

  .back-link {
    background: none; border: none; color: #90caf9;
    font-size: 14px; padding: 6px 0; text-align: left;
    align-self: flex-start; cursor: pointer;
  }

  .list-wrap { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 12px; }
  .list-item {
    background: #222; border: 1px solid #333; border-radius: 12px;
    padding: 14px 16px; text-align: left; color: #fff;
    font-size: 16px; cursor: pointer;
  }
  .list-item:active { background: #2e2e2e; }
  .li-name { font-weight: 600; }
  .li-sub { font-size: 13px; color: #aaa; margin-top: 4px; }
  .badge {
    display: inline-block; font-size: 11px; font-weight: 600;
    background: #4caf50; color: #fff; border-radius: 8px;
    padding: 2px 7px; margin-left: 6px; vertical-align: middle;
  }
  .empty-msg { color: #999; text-align: center; margin-top: 30px; font-size: 14px; }

  .chk-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; color: #ccc; margin-bottom: 14px;
  }
  .chk-row input { width: 18px; height: 18px; }

  .btn {
    font-size: 17px; font-weight: 600;
    padding: 14px 28px; border-radius: 10px;
    border: none; cursor: pointer;
    width: 100%; max-width: 360px;
  }
  .btn-primary { background: #2e7d32; color: #fff; }
  .btn-secondary { background: #444; color: #fff; margin-top: 12px; }
  .btn-row { display: flex; gap: 12px; width: 100%; max-width: 360px; }
  .btn-row .btn { flex: 1; margin-top: 0; }
  .center-col { align-items: center; justify-content: center; }

  /* ---- Màn hình camera ---- */
  #screen-camera { padding: 0; }
  #video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    background: #000;
  }
  #guideOverlay { position: absolute; pointer-events: none; }
  #guideOverlay svg { width: 100%; height: 100%; display: block; }
  #guideSizeLabel {
    position: absolute; font-size: 12px; color: #fff;
    background: rgba(0,0,0,0.55); padding: 3px 10px; border-radius: 10px;
    pointer-events: none; white-space: nowrap;
  }
  .hint-top {
    position: absolute; top: 14px; left: 0; right: 0;
    text-align: center; font-size: 14px;
    color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    padding: 0 16px;
  }
  .hint-name {
    position: absolute; top: 44px; left: 0; right: 0;
    text-align: center; font-size: 13px; color: #ffd54f;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .cam-back {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,0.5); color: #fff; border: none;
    border-radius: 8px; padding: 8px 12px; font-size: 13px;
  }
  #captureBtn {
    position: absolute; bottom: 30px; left: 50%;
    transform: translateX(-50%);
    width: 72px; height: 72px; border-radius: 50%;
    background: #fff; border: 5px solid rgba(255,255,255,0.4);
  }

  /* ---- Màn hình preview ---- */
  #screen-preview img, #canvasOut {
    max-width: 80vw; max-height: 65vh;
    border-radius: 8px; border: 2px solid #333; margin-bottom: 20px;
  }

  /* ---- Đang lưu / kết quả ---- */
  .spinner {
    width: 40px; height: 40px;
    border: 4px solid rgba(255,255,255,0.2);
    border-top-color: #4caf50; border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg-title { font-size: 18px; font-weight: 600; margin-bottom: 8px; text-align: center; }
  .msg-sub { font-size: 14px; color: #ccc; margin-bottom: 24px; text-align: center; }
  .error-box { color: #ff6b6b; }
</style>
</head>
<body>

  <!-- Màn hình 1: chọn ngày -->
  <div class="screen active" id="screen-date">
    <div class="screen-title">Chọn ngày</div>
    <div class="list-wrap" id="dateList"></div>
  </div>

  <!-- Màn hình 2: chọn người -->
  <div class="screen" id="screen-namepick">
    <button class="back-link" onclick="loadDates()">← Chọn ngày khác</button>
    <div class="screen-title" id="namepickTitle">Chọn người</div>
    <label class="chk-row">
      <input type="checkbox" id="includeDoneChk" onchange="loadNames()">
      Hiện cả người đã có ảnh
    </label>
    <div class="list-wrap" id="nameList"></div>
  </div>

  <!-- Màn hình 3: camera -->
  <div class="screen" id="screen-camera">
    <video id="video" autoplay playsinline muted></video>
    <button class="cam-back" onclick="cancelCamera()">← Quay lại</button>
    <div class="hint-top">Nhìn thẳng vào máy ảnh, căn đầu và vai theo đường kẻ xanh</div>
    <div class="hint-name" id="hintName"></div>
    <div id="guideOverlay">
      <svg viewBox="0 0 300 400" preserveAspectRatio="none">
        <rect x="2" y="2" width="296" height="396" fill="none" stroke="#ff3b30" stroke-width="4"/>
        <line x1="150" y1="0" x2="150" y2="400" stroke="#2979ff" stroke-width="1.5" stroke-dasharray="5 5"/>
        <line x1="35" y1="150" x2="265" y2="150" stroke="#2979ff" stroke-width="1.5" stroke-dasharray="5 5"/>
        <line x1="0" y1="240" x2="300" y2="240" stroke="#2979ff" stroke-width="1.5" stroke-dasharray="5 5"/>
        <ellipse cx="150" cy="150" rx="66" ry="95" fill="none" stroke="#2979ff" stroke-width="2.5"/>
        <path d="M 95 220 Q 60 260 0 396" fill="none" stroke="#2979ff" stroke-width="2.5"/>
        <path d="M 205 220 Q 240 260 300 396" fill="none" stroke="#2979ff" stroke-width="2.5"/>
      </svg>
    </div>
    <div id="guideSizeLabel">Khổ 3 × 4 cm</div>
    <button id="captureBtn" onclick="capturePhoto()"></button>
  </div>

  <!-- Màn hình 4: preview -->
  <div class="screen center-col" id="screen-preview">
    <canvas id="canvasOut" style="display:none;"></canvas>
    <img id="previewImg" alt="preview">
    <div class="btn-row">
      <button class="btn btn-secondary" onclick="retake()">Chụp lại</button>
      <button class="btn btn-primary" onclick="saveToDrive()">Lưu ảnh</button>
    </div>
  </div>

  <!-- Màn hình 5: đang lưu -->
  <div class="screen center-col" id="screen-saving">
    <div class="spinner"></div>
    <div class="msg-title">Đang lưu ảnh lên Google Drive...</div>
  </div>

  <!-- Màn hình 6: kết quả -->
  <div class="screen center-col" id="screen-result">
    <div class="msg-title" id="resultTitle"></div>
    <div class="msg-sub" id="resultSub"></div>
    <button class="btn btn-primary" onclick="loadDates()">Chụp ảnh khác</button>
  </div>

<script>
  /**
   * ===== CẤU HÌNH =====
   * Dán URL Web App (kết thúc bằng /exec) sau khi deploy Apps Script (Code.gs) vào đây.
   */
  var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzlO7DOeLlirKv9S-LdrP19OI6C1UYr6SBnIKbOjrmAgFJdMYni4ylFNmUFd2OelpEJ/exec';

  var videoEl, stream;
  var selectedDate = null, selectedRow = null, selectedName = null;
  var croppedBase64 = '';

  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(function(s){ s.classList.remove('active'); });
    document.getElementById(id).classList.add('active');
  }

  function apiUrlOk() {
    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf('DÁN_URL') === 0) {
      alert('Chưa cấu hình APPS_SCRIPT_URL trong file index.html.');
      return false;
    }
    return true;
  }

  /* ---------- Bước 1: chọn ngày ---------- */
  function loadDates() {
    stopStream();
    showScreen('screen-date');
    if (!apiUrlOk()) return;
    var container = document.getElementById('dateList');
    container.innerHTML = '<div class="empty-msg">Đang tải...</div>';
    fetch(APPS_SCRIPT_URL + '?action=dates')
      .then(function(r){ return r.json(); })
      .then(renderDates)
      .catch(function(err){ container.innerHTML = '<div class="empty-msg">Lỗi tải danh sách ngày: ' + err.message + '</div>'; });
  }

  function renderDates(list) {
    var container = document.getElementById('dateList');
    container.innerHTML = '';
    if (!list || !list.length) {
      container.innerHTML = '<div class="empty-msg">Không có dữ liệu.</div>';
      return;
    }
    list.forEach(function(d) {
      var btn = document.createElement('button');
      btn.className = 'list-item';
      btn.innerHTML = '<div class="li-name">' + d.label + '</div>';
      btn.onclick = function() {
        selectedDate = d.value;
        document.getElementById('includeDoneChk').checked = false;
        loadNames();
      };
      container.appendChild(btn);
    });
  }

  /* ---------- Bước 2: chọn người ---------- */
  function loadNames() {
    showScreen('screen-namepick');
    var includeDone = document.getElementById('includeDoneChk').checked;
    document.getElementById('namepickTitle').textContent = 'Chọn người — ' + formatDisplayDate(selectedDate);
    var container = document.getElementById('nameList');
    container.innerHTML = '<div class="empty-msg">Đang tải...</div>';
    fetch(APPS_SCRIPT_URL + '?action=names&date=' + encodeURIComponent(selectedDate) + '&includeDone=' + includeDone)
      .then(function(r){ return r.json(); })
      .then(renderNames)
      .catch(function(err){ container.innerHTML = '<div class="empty-msg">Lỗi tải danh sách: ' + err.message + '</div>'; });
  }

  function formatDisplayDate(v) {
    if (!v) return '';
    var p = v.split('-');
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function renderNames(list) {
    var container = document.getElementById('nameList');
    container.innerHTML = '';
    if (!list || !list.length) {
      container.innerHTML = '<div class="empty-msg">Không có ai phù hợp.</div>';
      return;
    }
    list.forEach(function(item) {
      var btn = document.createElement('button');
      btn.className = 'list-item';
      var sub = [];
      if (item.department) sub.push(item.department);
      if (item.empCode) sub.push('Mã: ' + item.empCode);
      btn.innerHTML =
        '<div class="li-name">' + item.name + (item.hasPhoto ? '<span class="badge">Đã có ảnh</span>' : '') + '</div>' +
        '<div class="li-sub">' + sub.join(' · ') + '</div>';
      btn.onclick = function() {
        selectedRow = item.row;
        selectedName = item.name;
        document.getElementById('hintName').textContent = 'Đang chụp cho: ' + selectedName;
        startCamera();
      };
      container.appendChild(btn);
    });
  }

  /* ---------- Bước 3: camera ---------- */
  function startCamera() {
    showScreen('screen-camera');
    videoEl = document.getElementById('video');
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function(s) {
      stream = s;
      videoEl.srcObject = s;
      videoEl.onloadedmetadata = function() {
        videoEl.play();
        positionGuide();
      };
    }).catch(function(err) {
      alert('Không thể mở camera: ' + err.message);
      loadNames();
    });
    window.addEventListener('resize', positionGuide);
  }

  function cancelCamera() {
    stopStream();
    loadNames();
  }

  function positionGuide() {
    var vw = window.innerWidth, vh = window.innerHeight;
    var guideH = vh * 0.72;
    var guideW = guideH * 3 / 4;
    if (guideW > vw * 0.88) {
      guideW = vw * 0.88;
      guideH = guideW * 4 / 3;
    }
    var left = (vw - guideW) / 2;
    var top = (vh - guideH) / 2;

    var g = document.getElementById('guideOverlay');
    g.style.left = left + 'px';
    g.style.top = top + 'px';
    g.style.width = guideW + 'px';
    g.style.height = guideH + 'px';

    var label = document.getElementById('guideSizeLabel');
    label.style.left = (left + guideW / 2) + 'px';
    label.style.top = (top + guideH + 8) + 'px';
    label.style.transform = 'translateX(-50%)';

    window._guideRect = { left: left, top: top, width: guideW, height: guideH };
  }

  function capturePhoto() {
    var vw = videoEl.clientWidth, vh = videoEl.clientHeight;
    var nw = videoEl.videoWidth, nh = videoEl.videoHeight;
    var scale = Math.max(vw / nw, vh / nh);

    var visibleNativeW = vw / scale;
    var visibleNativeH = vh / scale;
    var visibleNativeX = (nw - visibleNativeW) / 2;
    var visibleNativeY = (nh - visibleNativeH) / 2;

    var rect = window._guideRect;
    var srcX = visibleNativeX + rect.left / scale;
    var srcY = visibleNativeY + rect.top / scale;
    var srcW = rect.width / scale;
    var srcH = rect.height / scale;

    var outW = 900, outH = 1200;
    var canvas = document.getElementById('canvasOut');
    canvas.width = outW;
    canvas.height = outH;
    var ctx = canvas.getContext('2d');
    ctx.drawImage(videoEl, srcX, srcY, srcW, srcH, 0, 0, outW, outH);

    var dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    croppedBase64 = dataUrl.split(',')[1];
    document.getElementById('previewImg').src = dataUrl;

    stopStream();
    showScreen('screen-preview');
  }

  function retake() {
    showScreen('screen-camera');
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function(s) {
      stream = s;
      videoEl.srcObject = s;
      videoEl.onloadedmetadata = function() {
        videoEl.play();
        positionGuide();
      };
    }).catch(function(err) {
      alert('Không thể mở camera: ' + err.message);
      loadNames();
    });
  }

  function stopStream() {
    if (stream) {
      stream.getTracks().forEach(function(t){ t.stop(); });
      stream = null;
    }
  }

  /* ---------- Lưu ---------- */
  function saveToDrive() {
    if (!apiUrlOk()) return;
    showScreen('screen-saving');
    fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'save',
        row: selectedRow,
        fullName: selectedName,
        base64Data: croppedBase64
      })
    })
      .then(function(res) { return res.json(); })
      .then(onSaveSuccess)
      .catch(onSaveError);
  }

  function onSaveSuccess(res) {
    if (res && res.success) {
      document.getElementById('resultTitle').textContent = '✅ Đã lưu ảnh thành công';
      document.getElementById('resultSub').innerHTML =
        'Người: ' + selectedName + '<br>Thư mục: ' + res.folderName;
    } else {
      document.getElementById('resultTitle').textContent = '❌ Lưu ảnh thất bại';
      document.getElementById('resultTitle').classList.add('error-box');
      document.getElementById('resultSub').textContent = (res && res.error) || 'Lỗi không xác định.';
    }
    showScreen('screen-result');
  }

  function onSaveError(err) {
    document.getElementById('resultTitle').textContent = '❌ Lưu ảnh thất bại';
    document.getElementById('resultTitle').classList.add('error-box');
    document.getElementById('resultSub').textContent = err.message || String(err);
    showScreen('screen-result');
  }

  loadDates();
</script>
</body>
</html>
